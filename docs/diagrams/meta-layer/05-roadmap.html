      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --color-paper: #f5f5f5;
        --color-ink: #2d3142;
        --color-muted: #4f5d75;
        --color-accent: #eb6c36;
        --font-sans: "Geist", system-ui, sans-serif;
        --font-serif: "Instrument Serif", "Lora", serif;
        --font-mono: "Geist Mono", ui-monospace, monospace;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-paper);
        color: var(--color-ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 2rem;
      }
      .frame {
        max-width: 1200px;
        width: 100%;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: 0.5rem;
      }
      h1 {
        font-family: var(--font-serif);
        font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.2;
        color: var(--color-ink);
        margin-bottom: 0.5rem;
      }
      .sub {
        color: var(--color-muted);
        font-size: 1rem;
        line-height: 1.5;
        max-width: 46rem;
        margin-bottom: 1.5rem;
      }
      svg {
        width: 100%;
        min-width: 900px;
        display: block;
      }
      .cards {
        display: grid;
        grid-template-columns: 0.9fr 1.2fr 1fr;
        gap: 1rem;
        margin-top: 1.5rem;
      }
      .card {
        background: #ffffff;
        border: 1px solid rgba(45, 49, 66, 0.12);
        border-radius: 6px;
        padding: 1.25rem;
      }
      .card-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0.25rem 0 0.75rem;
      }
      .card-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--color-muted);
      }
      .card-dot.coral {
        background: var(--color-accent);
      }
      .card h3 {
        font-size: 1rem;
        font-weight: 600;
      }
      .card h4 {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin: 0.75rem 0 0.25rem;
      }
      .card li {
        font-size: 0.875rem;
        line-height: 1.5;
        margin-left: 1rem;
      }
      @media (max-width: 760px) {
        .cards {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
