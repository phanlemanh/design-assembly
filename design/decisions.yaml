# Determinism ledger: one row per design decision.
#   kind   standard | formula | closed | judgment
#   check  test:<path> | e2e:<path> | tool:<path> | eslint:<rule>. Leave it out until a check exists.
#          A test or e2e file names the decision it proves with `decision:<id>`. A tool is run by the gate.
#          Keep this file in block style.
version: 1
decisions:
  - id: product-type
    layer: context
    kind: judgment
    source: "design/blueprint.json"
  - id: conformance-level
    layer: context
    kind: judgment
    source: "design/blueprint.json"
  - id: source-color
    layer: foundations
    kind: judgment
    source: "design/blueprint.json"
  - id: tonal-palette
    layer: foundations
    kind: formula
    source: "the source color, tones 0 to 100"
    check: "tool:tools/design-assembly/check.mjs"
  - id: color-contrast
    layer: foundations
    kind: formula
    source: "WCAG 2.2 level AA, contrast ratio for text and for parts that are not text"
    check: "tool:tools/design-assembly/check.mjs"
    note: "every pair of the plugin's table of colour roles (references/color-roles.json) in light and dark mode, 30 in all: text at the threshold for text, a ring at the threshold for parts that are not text"
  - id: type-scale-values
    layer: foundations
    kind: standard
    source: "the framework's type scale"
    check: "tool:tools/design-assembly/check.mjs"
  - id: spacing-values
    layer: foundations
    kind: standard
    source: "the framework's 4px unit"
    check: "tool:tools/design-assembly/check.mjs"
  - id: radius-value
    layer: foundations
    kind: closed
    source: "shape scale, floor"
    check: "tool:tools/design-assembly/check.mjs"
  - id: checks-in-gate
    layer: governance
    kind: standard
    source: "make check"
    check: "tool:tools/design-assembly/check.mjs"
  - id: color-role
    layer: foundations
    kind: standard
    source: "the stylesheet's color roles"
    check: "eslint:shadcn/no-raw-colors"
  - id: type-scale
    layer: foundations
    kind: standard
    source: "the framework's type scale"
    check: "eslint:shadcn/no-arbitrary-values"
  - id: spacing
    layer: foundations
    kind: standard
    source: "the framework's spacing scale"
    check: "eslint:shadcn/no-arbitrary-values"
  - id: radius
    layer: foundations
    kind: standard
    source: "the shape scale derived from the stylesheet's corner radius"
    check: "eslint:shadcn/no-arbitrary-values"
  - id: no-restyled-component
    layer: components
    kind: closed
    source: "the variants each component declares"
    check: "eslint:shadcn/no-restyle"
  - id: no-inline-style
    layer: components
    kind: closed
    source: "no inline style"
    check: "eslint:shadcn/no-inline-styles"
  - id: whole-class-names
    layer: components
    kind: closed
    source: "class names written whole"
    check: "eslint:shadcn/require-static-classes"
  - id: raw-controls
    layer: components
    kind: standard
    source: "the core components"
    check: "eslint:no-restricted-syntax"
  - id: raw-table
    layer: components
    kind: standard
    source: "the table component"
    check: "eslint:no-restricted-syntax"
  - id: format-number-date
    layer: content
    kind: standard
    source: "one formatting module"
    check: "eslint:no-restricted-syntax"
  - id: lint-exceptions
    layer: governance
    kind: closed
    source: "a reason after every lint exception"
    check: "tool:tools/design_guards.mjs"
  - id: terms
    layer: content
    kind: closed
    source: "design/terms.json"
    check: "tool:tools/design_guards.mjs"
  - id: design-tokens
    layer: foundations
    kind: formula
    source: "src/index.css, written out by make design-tokens"
    check: "tool:tools/design-assembly/check.mjs"
  - id: color-palette
    layer: foundations
    kind: standard
    source: "no palette colour in source: neutral and status colours are color roles of the stylesheet"
    check: "eslint:shadcn/no-raw-colors"
  - id: component-manifest
    layer: components
    kind: formula
    source: "src/components, written out by make design-components"
    check: "tool:tools/design-assembly/check.mjs"
  - id: target-size
    layer: components
    kind: standard
    source: "WCAG 2.2 level AA, target size"
    check: "tool:tools/design-assembly/check.mjs"
    note: "the height each control declares in its own classes; its width, and controls that take their size from elsewhere, are not measured"
  - id: display-kind
    layer: components
    kind: closed
    source: "design/column-types.json"
    check: "tool:tools/design-assembly/check.mjs"
  - id: column-align
    layer: components
    kind: formula
    source: "the column type of the field"
    check: "tool:tools/design-assembly/check.mjs"
  - id: column-width
    layer: components
    kind: formula
    source: "the header and the sample length of the column type"
    check: "tool:tools/design-assembly/check.mjs"
    note: "the sample lengths and the padding, and that no screen sets a width; the sum itself is done by whatever draws the table, such as the typed table parts with their own tests"
  - id: table-density
    layer: components
    kind: formula
    source: "whether the columns fit at their least width"
    check: "tool:tools/design-assembly/check.mjs"
    note: "that no screen sets a row height; the choice between the two densities is made by whatever draws the table, such as the typed table parts with their own tests"
  - id: state-matrix
    layer: patterns
    kind: closed
    source: "design/states.json"
    check: "tool:tools/design-assembly/check.mjs"
    note: "that every screen declares the required states; that each one can be reached, and what it shows, is for the repository's own browser tests"
  - id: labels
    layer: content
    kind: closed
    source: "one place for every word a screen shows"
    check: "tool:tools/design-assembly/check.mjs"
    note: "text between tags and in attributes a person reads or hears; text built in code is not read"
  - id: error-copy
    layer: content
    kind: closed
    source: "an error message says what happened, then what to do next"
    check: "tool:tools/design-assembly/check.mjs"
    note: "that every error message has both parts; whether the words are right is a person's review"
  - id: notification-channel
    layer: patterns
    kind: closed
    source: "one channel for each kind of message"
    check: "tool:tools/design-assembly/check.mjs"
    note: "that no screen opens a browser dialog or calls a toast library itself; which channel a message takes is for the repository's own tests and a person's review"
  - id: undo-or-confirm
    layer: patterns
    kind: formula
    source: "the repository's own test of it"
    check: "test:tests/undo-or-confirm.test.tsx"
  - id: page-layouts
    layer: templates
    kind: closed
    source: "design/patterns, one page per kind of screen"
    check: "tool:tools/design-assembly/check.mjs"
    note: "that every screen is of exactly one kind, and that the kind's page names its main task; what the page says is a person's review"
  - id: reference-implementation
    layer: templates
    kind: closed
    source: "the screen each kind's page names as its reference"
    check: "tool:tools/design-assembly/check.mjs"
    note: "that the screen is listed, is of that kind and declares every required state; whether it is a good example is a person's review"
  - id: test-screen-sizes
    layer: templates
    kind: formula
    source: "design/screen-sizes.json: the reflow width of WCAG 2.2, and the widths a person adds"
    check: "tool:tools/design-assembly/check.mjs"
    note: "that the widths reach down to the reflow width, and that the browser test opens the file and names its widths; the test itself is not run again here, so a test that skips a width is not caught"
  - id: primary-task
    layer: context
    kind: judgment
    source: "design/patterns, the main task each page names"
  - id: one-main-one-h1
    layer: templates
    kind: standard
    source: "the repository's own browser test of it"
    check: "e2e:tests/e2e/templates.spec.ts"
  - id: no-sideways-scroll
    layer: templates
    kind: formula
    source: "the repository's own browser test of it"
    check: "e2e:tests/e2e/templates.spec.ts"
  - id: wcag-aa
    layer: templates
    kind: standard
    source: "the repository's own browser test of it"
    check: "e2e:tests/e2e/templates.spec.ts"
  - id: failed-action
    layer: patterns
    kind: closed
    source: "the repository's own test of it"
    check: "test:tests/failed-action.test.tsx"
  - id: information-order
    layer: context
    kind: judgment
    source: "design/patterns, the order each page gives its parts in"
  - id: copy-content
    layer: context
    kind: judgment
    source: "src/lib/labels.ts, the one place for every word a screen shows"
    note: "the owner confirmed on 2026-11-12 how the words are written, as the page of the kind says; the words themselves were not read one by one"
  - id: focus-after-action
    layer: patterns
    kind: standard
    source: "the repository's own browser test of it"
    check: "e2e:tests/e2e/templates.spec.ts"
  - id: tier-direction
    layer: governance
    kind: closed
    source: "design/parts.json, the parts of the code from the top down"
    check: "tool:tools/design-assembly/check.mjs"
    note: "imports written in source between files of the repository, static and dynamic; what a file reaches through a package is not read"
  - id: escapes
    layer: governance
    kind: closed
    source: "design/escapes.md, one line per fault that every check let through"
    check: "tool:tools/design-assembly/check.mjs"
    note: "that every line can be acted on; that a fault gets a line at all is a person's habit, and an empty record passes"
  - id: row-actions-in-view
    layer: patterns
    kind: standard
    source: "the repository's own browser test of it"
    check: "e2e:tests/e2e/templates.spec.ts"
  - id: record-panel
    layer: patterns
    kind: closed
    source: "design/blueprint.json, list-detail layout: over"
    check: "tool:tools/design-assembly/check.mjs"
    note: "that the record panel opens a record as the blueprint decides; the browser test of every page measures the arrangement at every width, and a screen that opens a record with a panel of its own is not caught"
  - id: empty-state-actions
    layer: patterns
    kind: closed
    source: "an empty state offers a button only where the person can fill the list there"
    check: "tool:tools/design-assembly/check.mjs"
    note: "that no empty state dresses a link as a button; whether it says why it is empty and how items arrive is a person's review"
  - id: navigation-in-frame
    layer: templates
    kind: closed
    source: "the application's frame, the same place and order on every screen"
    check: "tool:tools/design-assembly/check.mjs"
    note: "that no file below the frame links to a listed screen by its path; that the frame shows every screen in order is for the repository's own tests"
  - id: asked-action-closes
    layer: patterns
    kind: standard
    source: "the repository's own browser test of it"
    check: "e2e:tests/e2e/templates.spec.ts"
  - id: ledger-shapes
    layer: governance
    kind: closed
    source: "the design-assembly contract, one shape per ledger with its version"
    check: "tool:tools/design-assembly/check.mjs"
    note: "that each ledger present has its shape and a version this tool reads; what a ledger says is held by the rows about it"
  - id: decision-sheet
    layer: governance
    kind: closed
    source: "every choice points at a row, and every judgment nobody confirmed waits on the decision sheet"
    check: "tool:tools/design-assembly/check.mjs"
    note: "what this branch writes is read from git against the main branch; a person's answer is read from the note of a row, as the decision sheet writes it; the choices it reads are values, components, kinds of screen, states, words and column types, and free layout inside a screen is not read"
  - id: owner-calls
    layer: governance
    kind: closed
    source: "a new kind of screen and the brand colour wait for the owner's answer in the waiting list"
    check: "tool:tools/design-assembly/check.mjs"
    note: "a new page under design/patterns, and the root colour line of the stylesheet, against the main branch; enforcing it on the hosting service is not this tool's"
  - id: screen-ledger
    layer: templates
    kind: closed
    source: "design/screens, every screen with its kind and states"
    check: "tool:tools/design-assembly/check.mjs"
    note: "that the ledger has its shape and lists the screens the code lists, each family a kind with a page; that each screen's title and states are the code's is held by the repository's own test, tests/screens-ledger.test.ts"
  - id: screen-actions
    layer: templates
    kind: closed
    source: "design/screens.yaml, what each screen shows, opens with and offers, against ontology/"
    check: "tool:tools/design-assembly/check.mjs"
    note: "reads the ledger and the model as written: where a button sits is not checked, and that a role without the right does not see it while the screen runs is checked only by the browser test of the row screen-actions-seen, where the repository has it"
  - id: screen-actions-seen
    layer: templates
    kind: closed
    source: "tests/e2e/screen-actions-seen.spec.ts, entering as each role by tests/e2e/roles.ts, against the gate's table of screens by role"
    check: "tool:tools/design-assembly/check.mjs"
    note: "that the browser test is there, reads the gate's own plan and enters by tests/e2e/roles.ts, and that the file is there; the test itself runs with the repository's browser checks. A control is known only by its data-model-action mark, so a control of an action that lacks it is not seen; what a role that may not open a screen is shown instead, and the frame's navigation, are not checked"
  - id: font-loaded
    layer: foundations
    kind: closed
    source: "src/index.css, the typeface each of --font-sans and --font-heading names first"
    check: "tool:tools/design-assembly/check.mjs"
    note: "the first typeface of each list, against what the adapter of the build can see load it: an @font-face rule or a font package of the stylesheet, or the build's own font loader in a layout file; that the file holds the weights a screen uses is not checked"
  - id: typeface
    layer: foundations
    kind: closed
    source: "design/blueprint.json, text typeface floor, heading typeface text"
    check: "tool:tools/design-assembly/check.mjs"
    note: "answered by Manh Phan on 2026-11-21"
